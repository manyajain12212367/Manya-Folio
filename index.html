<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MANYA.FOLIO — Select Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cyan: #00fff7;
    --magenta: #ff00c8;
    --dark: #020408;
    --mid: #060d14;
    --card-bg: #0a1628;
    --glow-cyan: 0 0 20px #00fff7aa, 0 0 60px #00fff733;
    --glow-mag: 0 0 20px #ff00c8aa, 0 0 60px #ff00c833;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; }

  body {
    background: var(--dark);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: default;
    position: relative;
  }

  /* Animated grid background */
  .grid-bg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,247,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,247,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridMove 20s linear infinite;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes gridMove {
    0% { transform: translateY(0); }
    100% { transform: translateY(60px); }
  }

  /* Scan line overlay */
  .scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.15) 2px,
      rgba(0,0,0,0.15) 4px
    );
    pointer-events: none;
    z-index: 1;
  }

  /* Radial glow center */
  .radial-glow {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 800px; height: 800px;
    background: radial-gradient(circle, rgba(0,255,247,0.05) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
  }

  /* Corner decorations */
  .corner {
    position: fixed;
    width: 80px; height: 80px;
    border-color: var(--cyan);
    border-style: solid;
    opacity: 0.4;
    z-index: 2;
  }
  .corner.tl { top: 20px; left: 20px; border-width: 2px 0 0 2px; }
  .corner.tr { top: 20px; right: 20px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: 20px; left: 20px; border-width: 0 0 2px 2px; }
  .corner.br { bottom: 20px; right: 20px; border-width: 0 2px 2px 0; }

  /* Header */
  .header {
    position: relative;
    z-index: 10;
    text-align: center;
    margin-bottom: 20px;
    animation: fadeDown 0.8s ease forwards;
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo {
    font-family: 'Orbitron', monospace;
    font-size: clamp(1.8rem, 4vw, 3rem);
    font-weight: 900;
    letter-spacing: 0.3em;
    color: var(--cyan);
    text-shadow: var(--glow-cyan);
    position: relative;
  }
  .logo span { color: var(--magenta); text-shadow: var(--glow-mag); }

  .logo::after {
    content: '';
    display: block;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--cyan), var(--magenta), transparent);
    margin-top: 8px;
    animation: lineGlow 3s ease-in-out infinite;
  }
  @keyframes lineGlow {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  .subtitle {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    color: rgba(0,255,247,0.5);
    letter-spacing: 0.4em;
    margin-top: 10px;
    text-transform: uppercase;
  }

  /* Who's watching prompt */
  .prompt {
    position: relative;
    z-index: 10;
    font-family: 'Orbitron', monospace;
    font-size: clamp(0.9rem, 2vw, 1.2rem);
    font-weight: 400;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.2em;
    text-align: center;
    margin-bottom: 60px;
    animation: fadeDown 0.8s 0.2s ease both;
  }
  .prompt::before {
    content: '> ';
    color: var(--cyan);
    font-family: 'Share Tech Mono', monospace;
  }

  /* Profiles container */
  .profiles {
    display: flex;
    gap: 60px;
    position: relative;
    z-index: 10;
    animation: fadeUp 0.8s 0.4s ease both;
    flex-wrap: wrap;
    justify-content: center;
    padding: 0 20px;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Profile card */
  .profile-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    gap: 20px;
    group: true;
  }

  .profile-avatar {
    width: 160px; height: 160px;
    border: 2px solid transparent;
    position: relative;
    transition: transform 0.3s ease;
    clip-path: polygon(10px 0%, 100% 0%, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0% 100%, 0% 10px);
    overflow: hidden;
  }

  .profile-card:hover .profile-avatar {
    transform: scale(1.08) translateY(-8px);
  }

  /* Cyan profile - Technical */
  .profile-card.tech .profile-avatar {
    background: var(--card-bg);
    border-color: var(--cyan);
    box-shadow: 0 0 0 1px var(--cyan), inset 0 0 40px rgba(0,255,247,0.1);
  }
  .profile-card.tech:hover .profile-avatar {
    box-shadow: var(--glow-cyan), inset 0 0 60px rgba(0,255,247,0.2);
  }

  /* Magenta profile - Non-technical */
  .profile-card.nontech .profile-avatar {
    background: var(--card-bg);
    border-color: var(--magenta);
    box-shadow: 0 0 0 1px var(--magenta), inset 0 0 40px rgba(255,0,200,0.1);
  }
  .profile-card.nontech:hover .profile-avatar {
    box-shadow: var(--glow-mag), inset 0 0 60px rgba(255,0,200,0.2);
  }

  /* Avatar inner illustration */
  .avatar-inner {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Tech SVG icon */
  .avatar-icon {
    width: 90px; height: 90px;
    position: relative;
    z-index: 2;
  }

  /* Animated circuit lines inside tech card */
  .circuit-lines {
    position: absolute;
    inset: 0;
    opacity: 0.15;
    background-image:
      linear-gradient(var(--cyan) 1px, transparent 1px),
      linear-gradient(90deg, var(--cyan) 1px, transparent 1px);
    background-size: 20px 20px;
    transition: opacity 0.3s;
  }
  .profile-card.tech:hover .circuit-lines { opacity: 0.3; }

  .circuit-lines.mag {
    background-image:
      linear-gradient(var(--magenta) 1px, transparent 1px),
      linear-gradient(90deg, var(--magenta) 1px, transparent 1px);
  }
  .profile-card.nontech:hover .circuit-lines { opacity: 0.3; }

  /* Scan animation on hover */
  .scan-line {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: var(--cyan);
    top: -2px;
    opacity: 0;
    transition: none;
    z-index: 3;
  }
  .scan-line.mag { background: var(--magenta); }
  .profile-card:hover .scan-line {
    animation: scan 1.5s ease-in-out infinite;
    opacity: 1;
  }
  @keyframes scan {
    0% { top: 0%; }
    100% { top: 100%; }
  }

  /* Profile name */
  .profile-name {
    font-family: 'Orbitron', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
    transition: color 0.3s, text-shadow 0.3s;
    text-align: center;
  }
  .profile-card.tech:hover .profile-name {
    color: var(--cyan);
    text-shadow: var(--glow-cyan);
  }
  .profile-card.nontech:hover .profile-name {
    color: var(--magenta);
    text-shadow: var(--glow-mag);
  }

  /* Tag line under name */
  .profile-tag {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.15em;
    text-align: center;
    margin-top: -10px;
    transition: color 0.3s;
  }
  .profile-card.tech:hover .profile-tag { color: rgba(0,255,247,0.5); }
  .profile-card.nontech:hover .profile-tag { color: rgba(255,0,200,0.5); }

  /* Divider between cards */
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    color: rgba(255,255,255,0.15);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.7rem;
    animation: fadeUp 0.8s 0.5s ease both;
    position: relative;
    z-index: 10;
  }

  /* Bottom status bar */
  .status-bar {
    position: fixed;
    bottom: 25px;
    left: 0;
    right: 0;
    z-index: 10;
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.65rem;
    color: rgba(0,255,247,0.3);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    display: flex;
    gap: 30px;
    justify-content: center;
    align-items: center;
    text-align: center;
    white-space: nowrap;
    animation: fadeUp 0.8s 0.8s ease both;
  }
  .status-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--cyan);
    margin-right: 6px;
    animation: blink 2s ease-in-out infinite;
    box-shadow: 0 0 6px var(--cyan);
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  /* Click ripple effect */
  @keyframes ripple {
    0% { transform: scale(0); opacity: 1; }
    100% { transform: scale(4); opacity: 0; }
  }

  /* Glitch effect on load */
  .logo.glitch {
    animation: glitch 0.3s steps(2) forwards;
  }
  @keyframes glitch {
    0% { text-shadow: var(--glow-cyan); clip-path: none; }
    20% { text-shadow: 3px 0 var(--magenta), -3px 0 var(--cyan); }
    40% { text-shadow: -3px 0 var(--magenta), 3px 0 var(--cyan); transform: skewX(2deg); }
    60% { text-shadow: var(--glow-cyan); transform: skewX(-1deg); }
    100% { text-shadow: var(--glow-cyan); transform: skewX(0); }
  }

  /* Floating particles */
  .particle {
    position: fixed;
    width: 2px; height: 2px;
    background: var(--cyan);
    border-radius: 50%;
    pointer-events: none;
    z-index: 1;
    animation: float linear infinite;
    opacity: 0;
  }
  @keyframes float {
    0% { transform: translateY(100vh) translateX(0); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.6; }
    100% { transform: translateY(-20px) translateX(var(--drift)); opacity: 0; }
  }

  /* Specialty pills */
  .profile-specialties {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    max-width: 200px;
    margin-top: -10px;
  }
  .spec-pill {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    padding: 3px 10px;
    border: 1px solid rgba(255,0,200,0.4);
    color: rgba(255,0,200,0.6);
    background: rgba(255,0,200,0.05);
    clip-path: polygon(6px 0%, 100% 0%, calc(100% - 6px) 100%, 0% 100%);
    transition: all 0.3s;
    white-space: nowrap;
  }
  .spec-pill--cyan {
    border-color: rgba(0,255,247,0.4);
    color: rgba(0,255,247,0.6);
    background: rgba(0,255,247,0.05);
  }
  .profile-card.tech:hover .spec-pill {
    border-color: rgba(0,255,247,0.8);
    color: var(--cyan);
    background: rgba(0,255,247,0.1);
    text-shadow: 0 0 8px var(--cyan);
  }
  .profile-card.nontech:hover .spec-pill {
    border-color: rgba(255,0,200,0.8);
    color: var(--magenta);
    background: rgba(255,0,200,0.1);
    text-shadow: 0 0 8px var(--magenta);
  }

  /* Transition overlay */
  .transition-overlay {
    position: fixed;
    inset: 0;
    background: var(--dark);
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  .transition-overlay.active {
    opacity: 1;
    pointer-events: all;
  }

  /* Loading bar */
  .loading-bar {
    position: fixed;
    bottom: 0; left: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--cyan), var(--magenta));
    width: 0%;
    z-index: 101;
    transition: width 0.6s ease;
    box-shadow: 0 0 10px var(--cyan);
  }

  /* ── MOBILE ── */
  @media (max-width: 600px) {
    body { overflow-y: auto; justify-content: flex-start; padding: 40px 0 60px; }
    .corner { width: 40px; height: 40px; }
    .header { margin-bottom: 14px; padding: 0 16px; }
    .subtitle { font-size: 0.55rem; letter-spacing: 0.2em; }
    .prompt { font-size: 0.75rem; letter-spacing: 0.1em; margin-bottom: 36px; padding: 0 16px; }
    .profiles { flex-direction: column; gap: 28px; padding: 0 24px; width: 100%; }
    .profile-card { width: 100%; max-width: 340px; margin: 0 auto; }
    .profile-avatar { width: 120px; height: 120px; }
    .profile-name { font-size: 1rem; letter-spacing: 0.1em; }
    .spec-pills { gap: 5px; }
    .spec-pill { font-size: 0.5rem; padding: 3px 8px; }
    .select-hint { font-size: 0.55rem; }
    .radial-glow { width: 300px; height: 300px; }
  }
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="scanlines"></div>
<div class="radial-glow"></div>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="header">
  <div class="logo" id="logo">MANYA<span>.</span>FOLIO</div>
  <div class="subtitle">// personal portfolio system v2.0.26 //</div>
</div>

<div class="prompt">WHO_IS_VIEWING_THIS_SESSION</div>

<div class="profiles">
  <!-- Technical Profile -->
  <div class="profile-card tech" onclick="selectProfile('technical')" tabindex="0">
    <div class="profile-avatar">
      <div class="circuit-lines"></div>
      <div class="scan-line"></div>
      <div class="avatar-inner">
        <svg class="avatar-icon" viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Terminal/Code icon -->
          <rect x="8" y="18" width="74" height="54" rx="3" stroke="#00fff7" stroke-width="1.5" fill="none"/>
          <rect x="8" y="18" width="74" height="12" rx="3" fill="rgba(0,255,247,0.1)" stroke="#00fff7" stroke-width="1.5"/>
          <circle cx="20" cy="24" r="3" fill="#ff5f57"/>
          <circle cx="30" cy="24" r="3" fill="#febc2e"/>
          <circle cx="40" cy="24" r="3" fill="#28c840"/>
          <!-- Code lines -->
          <text x="16" y="44" font-family="monospace" font-size="8" fill="#00fff7" opacity="0.9">&gt;_</text>
          <line x1="28" y1="42" x2="55" y2="42" stroke="#00fff7" stroke-width="1.5" opacity="0.6"/>
          <line x1="16" y1="52" x2="48" y2="52" stroke="#00fff7" stroke-width="1.5" opacity="0.4"/>
          <line x1="16" y1="61" x2="62" y2="61" stroke="#00fff7" stroke-width="1.5" opacity="0.3"/>
          <!-- Cursor blink -->
          <rect x="16" y="54" width="6" height="10" fill="#00fff7" opacity="0.8">
            <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
          </rect>
        </svg>
      </div>
    </div>
    <div class="profile-name">Technical</div>
    <div class="profile-specialties">
      <span class="spec-pill spec-pill--cyan">Cyber Security</span>
    </div>
  </div>

  <div class="divider" style="align-self: center;">
    <div style="width: 1px; height: 40px; background: rgba(255,255,255,0.1);"></div>
    <span>OR</span>
    <div style="width: 1px; height: 40px; background: rgba(255,255,255,0.1);"></div>
  </div>

  <!-- Non-Technical Profile -->
  <div class="profile-card nontech" onclick="selectProfile('nontechnical')" tabindex="0">
    <div class="profile-avatar">
      <div class="circuit-lines mag"></div>
      <div class="scan-line mag"></div>
      <div class="avatar-inner">
        <svg class="avatar-icon" viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Person/Creative icon -->
          <!-- Head -->
          <circle cx="45" cy="28" r="14" stroke="#ff00c8" stroke-width="1.5" fill="rgba(255,0,200,0.08)"/>
          <!-- Body / shoulders -->
          <path d="M18 72 C18 58 28 50 45 50 C62 50 72 58 72 72" stroke="#ff00c8" stroke-width="1.5" fill="none"/>
          <!-- Face details -->
          <circle cx="40" cy="27" r="2" fill="#ff00c8" opacity="0.7"/>
          <circle cx="50" cy="27" r="2" fill="#ff00c8" opacity="0.7"/>
          <path d="M39 34 Q45 39 51 34" stroke="#ff00c8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <!-- Stars/sparkles around head -->
          <text x="12" y="22" font-size="8" fill="#ff00c8" opacity="0.6">✦</text>
          <text x="68" y="18" font-size="6" fill="#ff00c8" opacity="0.5">✦</text>
          <text x="70" y="35" font-size="5" fill="#ff00c8" opacity="0.4">✦</text>
          <!-- Network nodes on body -->
          <circle cx="45" cy="62" r="3" fill="rgba(255,0,200,0.3)" stroke="#ff00c8" stroke-width="1"/>
          <circle cx="30" cy="68" r="2" fill="rgba(255,0,200,0.2)" stroke="#ff00c8" stroke-width="1"/>
          <circle cx="60" cy="68" r="2" fill="rgba(255,0,200,0.2)" stroke="#ff00c8" stroke-width="1"/>
          <line x1="45" y1="62" x2="30" y2="68" stroke="#ff00c8" stroke-width="0.8" opacity="0.4"/>
          <line x1="45" y1="62" x2="60" y2="68" stroke="#ff00c8" stroke-width="0.8" opacity="0.4"/>
        </svg>
      </div>
    </div>
    <div class="profile-name">Non-Technical</div>
    <div class="profile-specialties">
      <span class="spec-pill">Content Writing</span>
      <span class="spec-pill">Event Mgmt</span>
      <span class="spec-pill">Project Mgmt</span>
    </div>
  </div>
</div>

<div class="status-bar">
  <span><span class="status-dot"></span>SYSTEM ONLINE</span>
  <span>PROFILES: 2</span>
  <span>SEC: LEVEL_3</span>
</div>

<div class="transition-overlay" id="overlay"></div>
<div class="loading-bar" id="loadingBar"></div>

<script>
  // Generate floating particles
  for (let i = 0; i < 25; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const drift = (Math.random() - 0.5) * 200;
    p.style.cssText = `
      left: ${Math.random() * 100}%;
      --drift: ${drift}px;
      animation-duration: ${5 + Math.random() * 10}s;
      animation-delay: ${Math.random() * 10}s;
      background: ${Math.random() > 0.5 ? '#00fff7' : '#ff00c8'};
      opacity: 0;
      width: ${Math.random() > 0.7 ? '3px' : '2px'};
      height: ${Math.random() > 0.7 ? '3px' : '2px'};
    `;
    document.body.appendChild(p);
  }

  // Glitch logo on load
  setTimeout(() => {
    document.getElementById('logo').classList.add('glitch');
  }, 600);

  // Keyboard support
  document.querySelectorAll('.profile-card').forEach(card => {
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        card.click();
      }
    });
  });

  function selectProfile(type) {
    const overlay = document.getElementById('overlay');
    const bar = document.getElementById('loadingBar');
    const colors = {
      technical: '#00fff7',
      nontechnical: '#ff00c8'
    };

    // Animate loading bar
    bar.style.background = `linear-gradient(90deg, ${colors[type]}, ${type === 'technical' ? '#ff00c8' : '#00fff7'})`;
    bar.style.boxShadow = `0 0 10px ${colors[type]}`;
    bar.style.width = '100%';

    // Fade to black
    setTimeout(() => {
      overlay.classList.add('active');
    }, 300);

    // Redirect
    setTimeout(() => {
      window.location.href = type === 'technical' ? 'technical.html' : 'nontechnical.html';
    }, 900);
  }

  // Fix bfcache black screen — reset overlay when user navigates back
  window.addEventListener('pageshow', function(e) {
    const overlay = document.getElementById('overlay');
    const bar = document.getElementById('loadingBar');
    if (overlay) {
      overlay.classList.remove('active');
      overlay.style.opacity = '0';
      overlay.style.pointerEvents = 'none';
    }
    if (bar) { bar.style.width = '0%'; }
  });
</script>
<style>
/* ── CUSTOM CURSOR ── */
* { cursor: none !important; }
#cursor-dot {
  position: fixed; top:0; left:0; z-index:99999; pointer-events:none;
  width:10px; height:10px; border-radius:50%;
  background: #00fff7;
  box-shadow: 0 0 8px #00fff7;
  transform: translate(-50%,-50%);
  transition: width 0.15s, height 0.15s, background 0.2s, box-shadow 0.2s;
  mix-blend-mode: screen;
}
#cursor-ring {
  position: fixed; top:0; left:0; z-index:99998; pointer-events:none;
  width:36px; height:36px; border-radius:50%;
  border: 1.5px solid #00fff7;
  transform: translate(-50%,-50%);
  transition: width 0.25s ease, height 0.25s ease, border-color 0.2s, opacity 0.2s;
  opacity:0.6;
}
#cursor-dot.hovering { width:6px; height:6px; background:#ff00c8; box-shadow:0 0 12px #ff00c8; }
#cursor-ring.hovering { width:58px; height:58px; border-color:#ff00c8; opacity:0.9; }
.cursor-trail {
  position: fixed; z-index:99997; pointer-events:none;
  border-radius:50%;
  transform: translate(-50%,-50%);
  mix-blend-mode: screen;
}
@media(max-width:900px){ #cursor-dot,#cursor-ring{ display:none !important; } * { cursor:auto !important; } }
</style>
<div id="cursor-dot"></div>
<div id="cursor-ring"></div>
<script>
(function(){
  var dot=document.getElementById("cursor-dot");
  var ring=document.getElementById("cursor-ring");
  if(!dot||!ring||"ontouchstart" in window) return;
  var mx=0,my=0,rx=0,ry=0;
  var TRAIL=14, trails=[];
  for(var i=0;i<TRAIL;i++){
    var t=document.createElement("div");
    t.className="cursor-trail";
    var sz=Math.max(1, 5-i*0.28);
    t.style.cssText="width:"+sz+"px;height:"+sz+"px;opacity:"+(0.55-i*0.035)+";";
    document.body.appendChild(t);
    trails.push({el:t,x:0,y:0});
  }
  document.addEventListener("mousemove",function(e){
    mx=e.clientX; my=e.clientY;
    dot.style.left=mx+"px"; dot.style.top=my+"px";
  });
  function lerp(a,b,t){return a+(b-a)*t;}
  function anim(){
    rx=lerp(rx,mx,0.14); ry=lerp(ry,my,0.14);
    ring.style.left=rx+"px"; ring.style.top=ry+"px";
    trails[0].x=lerp(trails[0].x,mx,0.45);
    trails[0].y=lerp(trails[0].y,my,0.45);
    trails[0].el.style.left=trails[0].x+"px";
    trails[0].el.style.top=trails[0].y+"px";
    trails[0].el.style.background="#00fff7";
    trails[0].el.style.boxShadow="0 0 6px #00fff7";
    for(var i=1;i<TRAIL;i++){
      trails[i].x=lerp(trails[i].x,trails[i-1].x,0.42);
      trails[i].y=lerp(trails[i].y,trails[i-1].y,0.42);
      trails[i].el.style.left=trails[i].x+"px";
      trails[i].el.style.top=trails[i].y+"px";
      var r2=i/TRAIL;
      var cr=Math.round(r2*255);
      var cg=Math.round(255-r2*255);
      var cb=Math.round(247-r2*47);
      trails[i].el.style.background="rgb("+cr+","+cg+","+cb+")";
      trails[i].el.style.boxShadow="0 0 4px rgb("+cr+","+cg+","+cb+")";
    }
    requestAnimationFrame(anim);
  }
  anim();
  var hSel="a,button,[onclick],input,textarea,.profile-card,.cert-card,.contact-card,.c-link,.proj-tile,.ach-card,.ach-tile,.sk-card,.exp-card,.btn-primary,.btn-secondary,.btn-gold,.btn-outline,.domain-tag,.pill,.hp,.sw-tag,.skill-cluster,.resume-download,.nav-cta,.nav-download,.vb-arrow";
  document.addEventListener("mouseover",function(e){
    if(e.target.closest(hSel)){dot.classList.add("hovering");ring.classList.add("hovering");}
  });
  document.addEventListener("mouseout",function(e){
    if(e.target.closest(hSel)){dot.classList.remove("hovering");ring.classList.remove("hovering");}
  });
  document.addEventListener("mousedown",function(){
    ring.style.transform="translate(-50%,-50%) scale(0.7)";
    dot.style.transform="translate(-50%,-50%) scale(0.5)";
  });
  document.addEventListener("mouseup",function(){
    ring.style.transform=""; dot.style.transform="";
  });
})();
</script>
</body>
</html>
